services:
  app:
    build:
      context: .
      target: runtime
    env_file: ${PIXELLE_ENV_FILE:-.env}
    environment:
      PIXELLE_DATABASE: /data/platform.sqlite3
      PIXELLE_TEMP_DIR: /tmp/pixelle
      TZ: Asia/Shanghai
    ports:
      - "${PIXELLE_BIND_HOST:-127.0.0.1}:${PIXELLE_PORT:-8000}:8000"
    volumes:
      - platform-data:/data
    tmpfs:
      - /tmp/pixelle:uid=10001,gid=10001,mode=0700
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  nginx:
    profiles: [edge]
    build:
      context: .
      target: edge
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PIXELLE_HTTP_PORT:-80}:80"
      - "${PIXELLE_HTTPS_PORT:-443}:443"
    volumes:
      - ${PIXELLE_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    restart: unless-stopped
volumes:
  platform-data:
