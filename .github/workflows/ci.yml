name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The lint step diffs against the PR base, so we need history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        # Only the subset CI needs; the full dependency set pulls heavy
        # media/ML packages that are irrelevant to lint and guard tests.
        run: uv pip install --system pytest pytest-asyncio ruff httpx pydantic loguru

      - name: Lint changed Python files
        # The repo has 127 pre-existing ruff findings (mostly import order, no
        # F821-class bugs). Gating on them would keep CI permanently red and train
        # everyone to ignore it, so we lint only files this branch touches.
        #
        # Note: `ruff check --diff` is NOT usable as a gate here. It exits 1
        # whenever it has any fix to suggest, and it reports findings for whole
        # files rather than only the changed lines, so every PR touching a legacy
        # file would fail regardless of what the PR changed. Listing the changed
        # files instead keeps the gate meaningful.
        # Shrink the baseline over time, then lint the whole tree.
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base ref available; skipping the changed-files lint."
            exit 0
          fi
          git fetch --depth 1 origin "$BASE" || true
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.py' || true)
          if [ -z "$FILES" ]; then
            echo "No Python files changed."
            exit 0
          fi
          echo "Linting changed files:"
          echo "$FILES"
          echo "$FILES" | xargs ruff check

      - name: Architecture and i18n guards
        # These assert project-wide invariants (AGENTS.md rules 1 and 4), so they
        # always run over the whole tree.
        run: pytest tests -q
